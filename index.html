<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Avatar Builder</title>
  <script type="module" crossorigin src="./assets/index-Bn5EfM_f.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BJnI6pCg.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/edit"><span class="logo-mark"></span><span class="logo-text">AVATAR<br />BUILDER</span></a>
    <nav class="topnav">
      <a class="pill" data-route="edit" href="#/edit"><i data-icon="user"></i>Avatar Edit</a>
      <a class="pill" data-route="gallery" href="#/gallery"><i data-icon="grid"></i>My Avatars</a>
    </nav>
    <div class="topbar-right">
      <button class="hbtn" id="btnSearch" title="Item Search"><i data-icon="search"></i><span>Item Search</span></button>
      <button class="hbtn round" id="btnHelp" title="Help" aria-label="Help"><i data-icon="help"></i></button>
    </div>
  </header>

  <main id="editor" class="view">
    <div id="viewport"></div>

    <div class="tabs" id="tabs"></div>
    <aside class="side" id="side">
      <nav class="cats" id="cats"></nav>
      <section class="panel" id="panel"></section>
    </aside>

    <aside class="side creator" id="creator" hidden></aside>
    <div class="color-panel" id="colorPanel" hidden></div>

    <div class="toolbar" id="toolbar"></div>

    <div class="bottom-left">
      <button class="btn ghost" id="btnBack"><i data-icon="back"></i>Back without Saving</button>
      <button class="btn primary" id="btnSave"><i data-icon="save"></i>Save<span class="badge" id="saveBadge" hidden>!</span></button>
    </div>
    <div class="bottom-right">
      <div class="stats">
        <div class="stat-chip"><i data-icon="glasses"></i><span id="statAcc">0/10</span></div>
        <div class="stat-line">Tris :<b id="statTris">0</b></div>
        <div class="stat-line" id="statHeightWrap">Height :<b id="statHeight">–</b></div>
      </div>
      <button class="btn ghost small" id="btnMisc"><i data-icon="gear"></i>Misc</button>
      <div class="misc-menu" id="miscMenu" hidden>
        <button data-misc="backup">Create a Backup</button>
        <button data-misc="restore">Restore from Backup</button>
        <button data-misc="vrm">VRM Export</button>
        <button data-misc="glb">GLB Export</button>
        <button data-misc="license">License</button>
        <button data-misc="close" class="close">Close →</button>
      </div>
    </div>

    <div class="photo-bar" id="photoBar" hidden></div>
    <div class="edit-bar" id="editBar" hidden></div>
    <div class="flash" id="flash" hidden></div>

    <div class="progress" id="progress" hidden>
      <div class="loading-row"><span class="spinner"></span><span>Loading data...</span><span id="progressPct">0%</span></div>
      <div class="bar"><div id="progressBar"></div></div>
    </div>

    <div class="loading" id="loading">
      <div class="loading-card">
        <div class="loading-art"><span class="logo-mark big"></span><div class="loading-title">AVATAR BUILDER</div></div>
        <div class="loading-row"><span class="spinner"></span><span id="loadingText">Loading data...</span><span id="loadingPct">0%</span></div>
        <div class="bar"><div id="loadingBar"></div></div>
      </div>
    </div>
  </main>

  <main id="gallery" class="view" hidden>
    <div class="gallery-head">
      <h1>My Avatars</h1>
      <button class="btn primary" id="btnNewAvatar"><i data-icon="plus"></i>New avatar</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </main>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
  <div class="toast" id="toast" hidden></div>
  <input type="file" id="fileInput" hidden />

</body>
</html>
